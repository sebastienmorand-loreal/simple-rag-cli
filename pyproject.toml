[project]
name = "simplerag"
version = "0.1.0"
description = "Simple RAG system"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "chromadb>=0.4.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "colorlog>=6.7.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
simplerag = "simplerag:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 120

[tool.uv]
dev-dependencies = [
    "black",
    "pylint>=3.3.7",
    "bandit>=1.8.6",
]
